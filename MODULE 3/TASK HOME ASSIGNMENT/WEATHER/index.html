<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>🌤 Weather Dashboard</h1>
            <p>Check the current weather of any city</p>
        </header>


        <div class="search-box">

            <input
                type="text"
                id="city"
                placeholder="Enter city name"
            >

            <button onclick="getWeather()">
                Search
            </button>

        </div>


        <p id="error"></p>


        <div id="weather" class="weather-card">

            <h2 id="cityName">Search for a city</h2>

            <div class="weather-icon" id="icon">
                🌍
            </div>

            <h3 id="temperature">-- °C</h3>

            <p id="condition">Weather condition</p>


            <div class="details">

                <div>
                    <strong id="wind">--</strong>
                    <span>Wind Speed</span>
                </div>

                <div>
                    <strong id="humidity">--</strong>
                    <span>Humidity</span>
                </div>

                <div>
                    <strong id="time">--</strong>
                    <span>Time</span>
                </div>

            </div>

        </div>


        <footer>
            <p>Weather Dashboard | Public API Project</p>
        </footer>

    </div>


    <script src="script.js"></script>

</body>
</html>
